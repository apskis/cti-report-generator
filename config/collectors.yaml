# Collectors Configuration
# Enable or disable threat intelligence collectors here.
# Each collector connects to a different API source for CTI data.
#
# To disable a collector, set enabled: false
# To re-enable, set enabled: true
#
# Collectors will only run if:
#   1. They are enabled here (enabled: true)
#   2. The required API credentials exist in Key Vault
#
# Note: You can still override this file entirely by setting the
# ENABLED_COLLECTORS environment variable (comma-separated list).
# Example: ENABLED_COLLECTORS=nvd,crowdstrike,intel471

collectors:

  # ── Vulnerability Data ──────────────────────────────────────────────

  - name: nvd
    description: "NIST National Vulnerability Database - CVE definitions and severity scores"
    enabled: true

  # ── Threat Intelligence ─────────────────────────────────────────────

  - name: intel471
    description: "Intel471 Titan - Underground threat intelligence and breach reports"
    enabled: true

  - name: crowdstrike
    description: "CrowdStrike Falcon Intelligence - Threat actors, detections, and indicators"
    enabled: true

  # ── Open Source Intelligence ────────────────────────────────────────

  - name: osint
    description: "Curated public news and research feeds (configure in osint_sources.yaml)"
    enabled: true

  # ── Operational Technology (OT) / ICS ───────────────────────────────

  - name: ics_advisory
    description: "ICS[AP] APIs (RapidAPI) - CISA ICS/OT advisories for the Operational Technology section"
    enabled: true

  - name: claroty
    description: "Claroty xDome - OT asset matching (targeted enrichment; enabled so the API token is loaded)"
    enabled: true

  - name: illumina_osint
    description: "Illumina company OSINT - public disclosures, news, and filings (quarterly only)"
    enabled: true
    quarterly_only: true  # Only runs for quarterly strategic reports

  # ── Breach Datasets (date-stamped incidents that ground the breach stat cards) ──

  - name: vcdb
    description: "Verizon VERIS Community Database - open, date-stamped peer breach incidents (quarterly only)"
    enabled: true
    quarterly_only: true

  - name: hhs_breach
    description: "HHS OCR breach portal - U.S. healthcare breaches with records-affected counts (quarterly only)"
    enabled: true
    quarterly_only: true

  - name: hibp_breach
    description: "Have I Been Pwned - global consumer/credential breach directory (opt-in; set breach_include_hibp)"
    enabled: false  # off by default: not an industry peer source; also gated by breach_include_hibp
    quarterly_only: true

  - name: ransomware_live
    description: "ransomware.live - public ransomware leak-site victims (peer-relevant sectors; quarterly only)"
    enabled: true
    quarterly_only: true

  - name: sec_8k
    description: "SEC EDGAR 8-K Item 1.05 - peer public-company material cyber-incident disclosures (quarterly only)"
    enabled: true
    quarterly_only: true
